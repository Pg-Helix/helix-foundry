# Phase 1 local stack (RFC-0005, helix-atlas). Assumes this workspace's
# sibling-checkout layout (helix-kernel, helix-cortex next to
# helix-foundry) -- build contexts are relative paths into those
# checkouts, not a generally released artifact yet. Bring up with
# `docker compose -f compose/docker-compose.yml up --build`.
services:
  postgres:
    build:
      context: ../../helix-kernel
      dockerfile: ../helix-foundry/images/kernel/Dockerfile
      args:
        PG_MAJOR: "17"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    build:
      context: ../../helix-cortex
      dockerfile: ../helix-foundry/images/cortex/Dockerfile
    environment:
      # helix_worker only -- no application-table privilege, no helix_owner
      # or helix_app credential (RFC-0005's point, not an oversight).
      DATABASE_URL: postgres://helix_worker:demo-worker-only-not-for-prod@postgres:5432/postgres?sslmode=disable
      CORTEX_MODEL_ID: local-mock-embed
      CORTEX_MODEL_REVISION: v1
      CORTEX_MODEL_DIMS: "8"
      CORTEX_POLL_INTERVAL_MS: "250"
    depends_on:
      postgres:
        condition: service_healthy
